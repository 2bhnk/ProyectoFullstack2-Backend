server:
  port: ${PORT:8080}

spring:
  application:
    name: machan-backend

  # Perfil por defecto: H2 en archivo (desarrollo local sin instalar nada).
  # Para usar MySQL: SPRING_PROFILES_ACTIVE=mysql  o  --spring.profiles.active=mysql
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:file:./data/machan_store;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jackson:
    time-zone: America/Santiago
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

app:
  jwt:
    # Clave HMAC-SHA256 (mínimo 32 bytes). En producción usar la variable de entorno JWT_SECRET.
    secret: ${JWT_SECRET:c2VjcmV0by1tcXV5LWV4dGVuc28tcGFyYS1qd3QtbWFjaGFuLXN0b3JlLTIwMjYtZHV1Yy1mdWxsc3RhY2s=}
    expiration-ms: 3600000          # 1 hora
    refresh-expiration-ms: 86400000 # 24 horas
  cors:
    # Orígenes del frontend React separados por coma (Vite 5173 y CRA 3000 por defecto).
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
